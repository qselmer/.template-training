name: Publish course site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  TEMPLATE_REPOSITORY: qselmer/.template-training

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render course site
        run: quarto render

      - name: Upload GitHub Pages artifact
        if: github.repository != env.TEMPLATE_REPOSITORY
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.repository != 'qselmer/.template-training'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
